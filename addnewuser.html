<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add New User - Basketball Scoreboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container-form {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
        }
        .container-form h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-control {
            padding: 12px;
            font-size: 16px;
            border-radius: 5px;
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            margin-top: 20px;
        }
        .error-message {
            color: #dc3545;
            text-align: center;
            margin-bottom: 15px;
            display: none;
        }
        .success-message {
            color: #28a745;
            text-align: center;
            margin-bottom: 15px;
            display: none;
        }
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        .back-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }
        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container-form">
        <h2>Add New User</h2>
        
        <div class="error-message" id="register-error"></div>
        <div class="success-message" id="register-success"></div>

        <form id="register-form">
            <div class="form-group">
                <label for="new-username" class="form-label">Username</label>
                <input type="text" class="form-control" id="new-username" placeholder="Enter new username" required>
            </div>
            <div class="form-group">
                <label for="new-password" class="form-label">Password</label>
                <input type="password" class="form-control" id="new-password" placeholder="Enter new password" required>
            </div>
            <div class="form-group">
                <label for="admin-key" class="form-label">Admin Key</label>
                <input type="password" class="form-control" id="admin-key" placeholder="Enter admin key" required>
            </div>
            <button type="submit" class="btn btn-primary btn-submit">Add User</button>
        </form>

        <div class="back-link">
            <a href="/">Back to Login</a>
        </div>
    </div>

    <script>
        const registerForm = document.getElementById('register-form');
        const registerErrorDiv = document.getElementById('register-error');
        const registerSuccessDiv = document.getElementById('register-success');

        // Handle user registration
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            registerErrorDiv.style.display = 'none';
            registerSuccessDiv.style.display = 'none';

            const newUsername = document.getElementById('new-username').value;
            const newPassword = document.getElementById('new-password').value;
            const adminKey = document.getElementById('admin-key').value;

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: newUsername, password: newPassword, adminKey })
                });

                const data = await response.json();

                if (response.ok) {
                    registerSuccessDiv.textContent = 'User added successfully! Redirecting to login...';
                    registerSuccessDiv.style.display = 'block';
                    registerForm.reset();
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 2000);
                } else {
                    registerErrorDiv.textContent = data.message || 'Failed to add user';
                    registerErrorDiv.style.display = 'block';
                }
            } catch (err) {
                registerErrorDiv.textContent = 'An error occurred. Please try again.';
                registerErrorDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
